name: Build APK

# 在 GitHub 的机器上打单机版 APK：
# 仓库里不需要装 Android SDK，云端 runner 自带。
# 跑完后在 Actions 页面下载 mindscape-apk 这个产物即可。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "mobile/capacitor.config.ts"
      - "mobile/package.json"
      - "mobile/package-lock.json"
      - "scripts/build-offline.sh"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装站点依赖
        run: npm ci --no-audit --no-fund

      - name: 安装 Capacitor
        run: npm ci --prefix mobile --no-audit --no-fund

      - name: 静态导出单机版
        run: bash scripts/build-offline.sh

      - name: 生成 Android 工程
        run: |
          cd mobile
          npx cap add android
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 编译 APK
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: mindscape-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
