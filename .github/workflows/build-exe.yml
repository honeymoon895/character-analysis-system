name: Build EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "desktop/**"
      - "scripts/build-offline.sh"
      - ".github/workflows/build-exe.yml"

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装站点依赖
        run: npm ci --no-audit --no-fund

      - name: 静态导出单机版
        run: bash scripts/build-offline.sh

      - name: 安装 Electron
        run: npm ci --prefix desktop --no-audit --no-fund

      - name: 打包 Windows 安装程序
        working-directory: desktop
        run: npx electron-builder --win nsis --x64 --publish never

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: mindscape-exe
          path: desktop/dist/*.exe
          if-no-files-found: error
